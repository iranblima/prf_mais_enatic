ofunda\"", "Doc é PRÉ-requisito de código", "Conhecimento concentrado em pessoas é risco clássico", "Impessoalidade por design"]}, {"k": "Segurança e auditoria", "h": "Cada ação, gravada para sempre.", "tp": ["Quem executa ≠ quem audita (separação rígida)", "Acesso: Corregedoria / Gestor de Segurança", "11 frentes de remediação P0–P3 — processo contínuo"]}, {"k": "Observabilidade ponta a ponta", "h": "Se algo falhar, nós sabemos primeiro.", "tp": ["Callback: \"lembram das falhas silenciosas de integração?\"", "Sentry · Grafana · Loki · Prometheus", "\"Se algo falhar, nós sabemos primeiro\""]}, {"k": "", "h": "Legado vs PRF+", "tp": ["Deixar lerem por ~20s", "Destacar só 1 linha", "\"Cada linha da direita: feita por esta equipe, nesta instituição\""]}, {"k": "O projeto em números", "h": "", "tp": ["Falar números devagar (manchetes)", "Zero bugs críticos como critério", "Paridade 100%: \"ninguém perde funcionalidade\" — compromisso desde o dia 1"]}, {"k": "O caminho até dezembro", "h": "Rollout controlado.", "tp": ["Hoje: apresentação ao público", "Piloto: 20 agentes, unidade selecionada", "Lotes regionais → DEZ: produção p/ 100% do efetivo", "Fase 3: RA, voz, mais IA"]}, {"k": "Quem constrói", "h": "Feito pela PRF, para a PRF.", "tp": ["\"Não é mérito de tecnologia, é de gente\"", "Regra de ouro: transferência de conhecimento", "Citar membros presentes, se apropriado"]}, {"k": "", "h": "Isso não é o fim de um projeto.", "tp": ["Provocação final", "\"Mais rápido, mais barato, com mais qualidade do que jamais foi possível\""]}, {"k": "", "h": "One more thing.", "tp": ["PAUSA — deixar a expectativa crescer", "Sorrir. Não falar nada por 3s"]}, {"k": "", "h": "Antigão", "tp": ["Só a palavra na tela", "PAUSA — deixar o público tentar adivinhar", "\"O que será que é o Antigão?\""]}, {"k": "Demonstração", "h": "", "tp": ["Falar o prompt em voz alta, como no vídeo", "Linguagem natural — sem código, sem jargão", "Gancho: \"e o resultado?\""]}, {"k": "Prompt de voz", "h": "«Criança menor de dois anos sendo transportada sem cadeirinha.»", "tp": ["Ler o prompt em voz alta, no ritmo da fiscalização", "Linguagem natural — sem menu, sem código decorado", "Gancho: \"e o resultado?\""]}, {"k": "Resultado", "h": "10 enquadramentos encontrados.", "tp": ["Da voz ao enquadramento em segundos", "Art. 168, código 519-30 no topo — com instrução de fiscalização", "Botão único: iniciar autuação com o código"]}, {"k": "Inteligência normativa", "h": "Antigão", "tp": ["Momento surpresa da apresentação", "IA aplicada à decisão jurídica em campo", "Menos tempo na norma, mais precisão no auto"]}, {"k": "", "h": "PRF+", "tp": ["PAUSA LONGA antes de falar", "Devagar: \"PRF+. Dezembro de 2026.\""]}, {"k": "", "h": "Obrigado.", "tp": ["Permanecer no palco p/ perguntas"]}];
  const SCRIPT = [{"time": "0:00", "html": "<p><em class=\"cue\">(Entre no palco com o slide já projetado. Espere o silêncio. Não se apresente ainda.)</em></p><p>&quot;Bom dia.&quot;</p><p><em class=\"cue\">(pausa)</em></p><p>&quot;Hoje eu quero contar uma história. A história de como a PRF decidiu retomar o controle da ferramenta mais importante que um policial carrega no bolso.&quot;</p>"}, {"time": "1:30", "html": "<p>&quot;Meu nome é Tiago Sousa Amorim, tenho 42 anos, sou Policial Rodoviário Federal há 21 anos e gerente do Projeto PRF+ — o projeto que deu origem ao que vocês vão ver hoje.</p><p>E eu começo dizendo o que o PRF+ <strong>não</strong> é. Ele não é apenas um aplicativo. É um ecossistema digital completo: para o policial em campo, para a área negocial, e para a gestão institucional.&quot;</p>"}, {"time": "3:00", "html": "<p>&quot;Treze mil policiais. Todos os dias.</p><p>Cada abordagem, cada consulta de placa, cada auto de infração passa por um aplicativo. Quando esse aplicativo falha, não é um bug. É um policial sozinho, de madrugada, numa rodovia, sem informação.</p><p>Foi com essa responsabilidade que a gente construiu tudo o que vem a seguir.&quot;</p>"}, {"time": "5:00", "html": "<p>&quot;Mas para entender aonde chegamos, precisamos falar de onde partimos.</p><p>O <strong>PRF Móvel</strong>, desenvolvido e mantido por colegas da própria PRF, sustenta a operação na ponta há anos — e merece esse reconhecimento.</p><p>Só que a demanda cresceu. O sistema roda <strong>só em Android</strong> — não existe versão iOS. Falhas eram difíceis de detectar em tempo real, e as trilhas de auditoria podiam ser mais completas.</p><p>Não é uma crítica — é um diagnóstico de maturidade. O cenário pedia evolução.&quot;</p><p><em class=\"cue\">(dê 15 segundos para a plateia ler o grid)</em></p>"}, {"time": "8:00", "html": "<p>&quot;Então tomamos uma decisão. A mais difícil e a mais importante do projeto.</p><p><strong>Assumir.</strong></p><p>E aqui é importante ser preciso: essa decisão se refere ao <strong>projeto que deu origem ao PRF+</strong> — um projeto em Flutter, com backend Node.js, iniciado em parceria entre o <strong>Instituto Federal do Ceará — IFCE</strong> — e a PRF.</p><p>A PRF internalizou esse projeto, adquiriu domínio completo sobre sua arquitetura e operação, e o reestruturou para garantir <strong>autonomia, continuidade e evolução</strong>.&quot;</p>"}, {"time": "10:00", "html": "<p>&quot;Essa foi a jornada — a jornada do PRF+, especificamente.</p><p>O projeto nasceu da parceria entre IFCE e PRF, operando na nuvem Azure, sobre uma base tecnicamente bem construída. Na internalização, foi preciso compreender profundamente os componentes e os fluxos existentes e reescrever grande parte da solução — com pouco suporte disponível na transição. Foi desafiador, mas partimos de um bom alicerce.</p><p>Depois, a migração para o <strong>data center da própria PRF</strong> — com economia direta de recursos públicos e soberania sobre dados policiais. E a reestruturação completa da plataforma.</p><p>E hoje: equipe mista, documentação como pré-requisito de qualquer implementação, review de código com IA e humano, entregas semanais.</p><p>Cada etapa dessa linha foi vencida. E o resultado disso tudo tem nome.&quot;</p>"}, {"time": "12:30", "html": "<p><em class=\"cue\">(pausa longa — deixe o slide aparecer sozinho)</em></p><p>&quot;Este é o <strong>PRF+</strong>.&quot;</p><p><em class=\"cue\">(aplausos/pausa)</em></p>"}, {"time": "14:30", "html": "<p>&quot;O PRF+ foi construído sobre cinco pilares. Cada decisão técnica do projeto responde a pelo menos um deles.</p><p><strong>Confiável</strong> — informação em tempo real, de fontes autoritativas, com tratamento explícito de falha.<br><strong>Multiplataforma</strong> — Android e iOS.<br><strong>Offline-first</strong> — porque a estrada não tem cobertura móvel garantida.<br><strong>Inteligente</strong> — IA a serviço do policial.<br><strong>Auditável</strong> — toda ação relevante, registrada para sempre.&quot;</p>"}, {"time": "16:30", "html": "<p>&quot;Pela primeira vez na história da PRF: <strong>iOS</strong>.</p><p>Uma única base de código Flutter. Mesma funcionalidade, mesma experiência, nas duas plataformas. Isso destrava a padronização de dispositivos institucionais e reduz o custo de cada evolução futura — estimamos <strong>36% de economia</strong> em horas de desenvolvimento comparado a manter sistemas separados.&quot;</p>"}, {"time": "18:00", "html": "<p>&quot;Quem já trabalhou numa BR sabe: cobertura de rede é privilégio, não regra.</p><p>O PRF+ é <strong>offline-first por design</strong>. Consultas ficam em cache, capturas e eventos são armazenados no dispositivo, e tudo sincroniza automaticamente quando a conectividade volta.</p><p>O policial nunca fica refém do sinal.&quot;</p>"}, {"time": "19:30", "html": "<p>&quot;E quando tem rede, o PRF+ entrega o que chamamos de Consulta de Pessoa V3.</p><p><strong>Diversas fontes de dados. Em paralelo. Numa única requisição.</strong></p><p>Entre elas: Motor PESSOA, BNMP, RENACH, Motor VEÍCULOS, Motor REGISTROS e Sinal Desaparecidos — e outras fontes integradas à plataforma. Cada fonte com tratamento de degradação independente — se uma falha, as demais continuam entregando.</p><p>E com regras de negócio pensadas para a segurança jurídica do agente: o RENACH, por exemplo, nunca entra em estado que possa induzir o policial ao erro.&quot;</p>"}, {"time": "21:30", "html": "<p>&quot;O coração operacional: o <strong>AutoPRF v2</strong> — o talão eletrônico reinventado.</p><p>Lavratura completa de auto de infração no app. Impressão em campo com impressoras térmicas Zebra — o condutor sai da abordagem com o documento na mão.</p><p>E estamos em processo de homologação junto à SENATRAN, com a validação da área negocial, para a certificação nacional do talonário.&quot;</p>"}, {"time": "23:30", "html": "<p>&quot;Agora, o que me deixa mais orgulhoso tecnicamente.</p><p><strong>Inteligência artificial rodando dentro do dispositivo.</strong> Não na nuvem. No aparelho, na viatura, na estrada.</p><p>OCR de placas com YOLOX. Reconhecimento facial com FaceNet. Os dois via TensorFlow Lite, embarcados — funcionam sem rede.</p><p>E sobre IA... guardem esse assunto. Ainda volto nele antes do fim.&quot;</p><p><em class=\"cue\">(plante a semente do One more thing sem entregar)</em></p>"}, {"time": "25:30", "html": "<p>&quot;Tudo isso se conecta na fiscalização com abordagem: pessoa, veículo, veículos atrelados, fotos e GPS — num fluxo único, com armazenamento offline.</p><p>Uma abordagem, uma operação, tudo registrado.&quot;</p>"}, {"time": "26:30", "html": "<p>&quot;E o PRF+ não é só para quem está na ponta.</p><p>Pela primeira vez, a gestão tem um <strong>painel administrativo dedicado</strong>: gestão de usuários e perfis com inbox de aprovação, indicadores agregados de operação — disponibilidade e uso, sem localização nem identificação individual —, dashboards operacionais, e feature flags para ativar funcionalidades de forma controlada — por ambiente, por perfil, progressivamente.</p><p>Antes, isso dependia de scripts e consultas diretas no banco. Agora é um clique.&quot;</p>"}, {"time": "27:00", "html": "<p><em class=\"cue\">(transição — tom mais técnico)</em></p><p>&quot;E por baixo disso tudo... uma nova arquitetura.</p><p>E para falar dela, eu quero chamar ao palco quem a construiu por dentro: o Policial Rodoviário Federal <strong>Iran Barros Lima</strong>, desenvolvedor do PRF+. Iran, o palco é seu.&quot;</p><p><em class=\"cue\">(Iran entra — aplausos — Tiago sai de cena)</em></p>"}, {"time": "27:45", "html": "<p><em class=\"cue\">(Iran se apresenta: nome, função no projeto, há quanto tempo desenvolve o PRF+)</em></p><p>&quot;São <strong>dezenove microsserviços independentes</strong>, escaláveis por demanda no Kubernetes.</p><p>Autenticação institucional, gestão de usuários, motor de busca, AutoPRF, observabilidade... cada um evolui, escala e falha de forma isolada. Um problema num serviço não derruba mais o sistema inteiro.&quot;</p>"}, {"time": "29:15", "html": "<p>&quot;O stack, de ponta a ponta: <strong>Flutter</strong> no mobile, com Clean Architecture e storage local. <strong>NestJS</strong> no backend, com API Gateway, Kafka, Redis e PostgreSQL. <strong>React</strong> com TypeScript e GraphQL no painel administrativo.</p><p>Tecnologia atual, mercado aquecido de profissionais, comunidade ativa. Nada de stack exótico que vira refém de especialista.&quot;</p>"}, {"time": "30:45", "html": "<p>&quot;E onde isso roda?</p><p><strong>Em casa.</strong> Kubernetes no data center da própria PRF.</p><p>Saímos de uma nuvem comercial externa — no contexto do projeto que deu origem ao PRF+ — para infraestrutura própria. Isso significa <strong>economia direta de recursos institucionais</strong>, com a redução de custos de infraestrutura externa contratada. E significa mais: <strong>autonomia, governança e controle</strong> sobre a solução. Dados de abordagem, de autuação, de inteligência: dentro do perímetro institucional.&quot;</p>"}, {"time": "32:30", "html": "<p>&quot;A esteira de entrega é onde a impessoalidade vira prática.</p><p>Push no repositório → pipeline identifica o microsserviço alterado → lint, testes, build → análise de vulnerabilidades com CodeQL → imagem publicada → deploy automático no cluster com health check.</p><p><strong>Do commit ao campo, sem intervenção manual.</strong> E com rastreabilidade total: do card de planejamento à issue, ao PR, ao commit, à tag, à imagem, ao pod rodando em produção. Qualquer entrega é auditável de ponta a ponta.&quot;</p>"}, {"time": "34:30", "html": "<p>&quot;Qualidade de código, no PRF+, tem duas camadas.</p><p>Primeira: <strong>GitHub Copilot Code Review</strong> — automático, contextualizado com instruções customizadas do nosso projeto.</p><p>Segunda: <strong>revisão humana obrigatória</strong> pelo time mantenedor, garantida por regras do próprio repositório.</p><p>Nada — nada — entra em produção sem passar pelos dois.&quot;</p>"}, {"time": "36:00", "html": "<p>&quot;E aqui está talvez a mudança cultural mais profunda do projeto.</p><p>No PRF+, <strong>documentação é pré-requisito de implementação</strong>. Antes de qualquer linha de código: um SDD com a solução desenhada — arquitetura, contratos, modelo de dados. Um GDD com a quebra em tarefas atômicas e critérios de aceite objetivos. E ADRs registrando cada decisão arquitetural, com contexto e alternativas.</p><p>Por que isso importa? Porque conhecimento concentrado em pessoas é um risco clássico de qualquer sistema. No PRF+, o conhecimento pertence à <strong>instituição</strong>. Qualquer desenvolvedor que chegue amanhã consegue entender por que cada decisão foi tomada.</p><p>Isso é impessoalidade por design.&quot;</p>"}, {"time": "38:00", "html": "<p>&quot;Segurança e auditoria.</p><p>Toda ação relevante — consulta, autuação, acesso a dado sensível — entra numa <strong>trilha imutável em cadeia de hash</strong>, verificável por endpoint dedicado, com acesso restrito à Corregedoria e ao Gestor de Segurança. Quem executa não é quem audita. Separação rígida.</p><p>Autenticação federada realizada pelo <strong>SouGov</strong> e também pelo <strong>PRF Segurança</strong> — preservando a compatibilidade necessária —, com sessões de curta duração. E conformidade <strong>LGPD nativa</strong>: retenção controlada e expurgo automático de dados sensíveis.</p><p>Além disso, mantemos um plano ativo de remediação de segurança em onze frentes, priorizadas de P0 a P3 — segurança como processo contínuo, não como checklist.&quot;</p>"}, {"time": "39:15", "html": "<p>&quot;E lembram das integrações que falhavam sem ninguém detectar?</p><p>Isso acabou. Erros, logs e métricas centralizados — Sentry, Grafana, Loki, Prometheus — do app na estrada ao pod no cluster. Runbooks prontos para cada alerta crítico.</p><p><strong>Se algo falhar, nós sabemos primeiro.</strong> É o fim da era em que o policial descobria o problema antes da TI.&quot;</p>"}, {"time": "40:00", "html": "<p>&quot;Colocando lado a lado, a transformação fica evidente.&quot;</p><p><em class=\"cue\">(deixe a plateia ler — 20 segundos — e destaque só uma linha)</em></p><p>&quot;Cada linha dessa coluna da direita foi construída por esta equipe, dentro desta instituição.&quot;</p>"}, {"time": "41:30", "html": "<p>&quot;O projeto em números.</p><p><strong>36% de economia</strong> em desenvolvimento. Mais de <strong>11 mil horas</strong> de esforço planejado. Critérios de aceitação exigentes: <strong>99% de disponibilidade</strong>, resposta abaixo de <strong>3 segundos</strong>, <strong>zero bugs críticos</strong> em produção, e <strong>100% de paridade funcional</strong> com o legado — porque ninguém vai perder funcionalidade nessa transição. Isso foi um compromisso de projeto desde o primeiro dia.</p><p>E para falar do caminho daqui pra frente, devolvo a palavra ao nosso gerente de projeto. Tiago.&quot;</p><p><em class=\"cue\">(Iran passa a palavra — Tiago retorna ao palco)</em></p>"}, {"time": "43:00", "html": "<p><em class=\"cue\">(Tiago assume daqui até o final)</em></p><p>&quot;Obrigado, Iran. E o caminho a partir de agora.</p><p><strong>Hoje, 18 de agosto, é a apresentação do PRF+ ao público</strong> — o dia em que ele deixa de ser um projeto interno e passa a ser um compromisso público.</p><p>Setembro: projeto piloto com 20 agentes em unidade selecionada. Na sequência, rollout gradual por lotes regionais. E em <strong>dezembro de 2026, o lançamento da versão de produção</strong>: 100% dos 13 mil servidores.</p><p>Depois disso, a Fase 3: realidade aumentada, comando de voz, e ainda mais IA. A plataforma está pronta para isso.&quot;</p>"}, {"time": "45:00", "html": "<p>&quot;Nada disso é mérito de tecnologia. É mérito de gente.</p><p>Uma equipe mista — policiais desenvolvedores e fábrica de software — com uma regra de ouro: <strong>transferência efetiva de conhecimento</strong> para o corpo da PRF. DTIC, DISTI Segurança, DISTI Infraestrutura, áreas negociais.</p><p>Feito pela PRF, para a PRF.&quot;</p><p><em class=\"cue\">(se apropriado, cite nominalmente os principais membros da equipe presentes)</em></p>"}, {"time": "46:30", "html": "<p>&quot;E eu quero encerrar com uma provocação.</p><p>O 18 de agosto não é o fim de um projeto. É o começo de uma <strong>plataforma</strong>. A base sobre a qual as próximas ferramentas da atividade policial vão ser construídas — mais rápido, mais barato, e com mais qualidade do que jamais foi possível.</p><p>Era isso que eu tinha para mostrar a vocês hoje. Em nome de toda a equipe do PRF+... muito obrigado.&quot;</p><p><em class=\"cue\">(tom de encerramento — agradeça de verdade, deixe parecer que a apresentação acabou · aguarde o início dos aplausos antes de avançar para o próximo slide)</em></p>"}, {"time": "46:30", "html": "<p><em class=\"cue\">(pausa. sorria. deixe o slide aparecer e a plateia reagir — quem conhece a referência vai entender na hora)</em></p><p>&quot;Mas antes de encerrar...</p><p>...tem mais uma coisa.&quot;</p>"}, {"time": "47:00", "html": "<p><em class=\"cue\">(deixe apenas a palavra na tela · pausa · deixe o público tentar adivinhar)</em></p><p>&quot;Antigão.</p><p><em class=\"cue\">(pausa)</em></p><p>O que será que é isso?&quot;</p>"}, {"time": "47:20", "html": "<p>&quot;Em vez de explicar, eu vou mostrar. O policial abre o aplicativo... e simplesmente fala.&quot;</p>"}, {"time": "47:35", "html": "<p><em class=\"cue\">(leia o prompt em voz alta, no ritmo de quem está na fiscalização)</em></p><p>&quot;<strong>«Criança menor de dois anos sendo transportada sem cadeirinha.»</strong></p><p>Sem menu. Sem código de infração decorado. Linguagem natural — do jeito que a gente fala na pista.&quot;</p>"}, {"time": "47:50", "html": "<p>&quot;E o resultado: <strong>dez enquadramentos encontrados</strong>, em segundos.</p><p>No topo, o mais provável: código <strong>519-30</strong>, artigo 168 do CTB — transportar criança sem observância das normas de segurança. Com a situação encontrada, a instrução de fiscalização e a medida administrativa.</p><p>E um único botão: <strong>iniciar a autuação com o código já preenchido</strong>. Da voz ao auto de infração, sem sair da tela.&quot;</p>"}, {"time": "47:30", "html": "<p>&quot;Lembram que eu pedi para guardarem o assunto IA?</p><p>Apresento o <strong>Antigão</strong> — nossa inteligência normativa.</p><p>Uma IA que auxilia o policial no <strong>enquadramento legal da infração</strong>, no momento da autuação. A consulta à norma que levava minutos, acontece em segundos. Menos tempo procurando o artigo certo, mais segurança jurídica no auto — para o agente e para o cidadão.</p><p>IA aplicada não para substituir a decisão do policial. Para <strong>qualificá-la</strong>.&quot;</p>"}, {"time": "48:30", "html": "<p><em class=\"cue\">(pausa longa)</em></p><p>&quot;<strong>PRF+. Dezembro de 2026.</strong></p><p>Na palma da mão de quem protege a estrada.&quot;</p>"}, {"time": "49:15", "html": "<p>&quot;Obrigado.&quot;</p><p><em class=\"cue\">(apresente a equipe: Tiago Sousa Amorim — gerente do projeto; Wilher Lima Teixeira — desenvolvedor; Iran Barros Lima — desenvolvedor)</em></p><p><em class=\"cue\">(permaneça no palco para perguntas, se houver espaço na agenda)</em></p><p>- <strong>Ensaie as pausas.</strong> O estilo Apple vive do silêncio antes dos reveals (slides 7 e 30).<br>- <strong>Não leia os slides.</strong> Eles têm poucas palavras de propósito — o conteúdo é a sua fala.<br>- <strong>Controle de tempo por bloco:</strong> se estiver atrasado ao fim do Bloco 3 (27 min), comprima os slides 18 e 20 (stack e DevOps) — a plateia gestora sente menos falta deles.<br>- <strong>Navegação:</strong> setas ← → ou clique avançam; <strong>F</strong> para tela cheia; a barra de progresso no topo ajuda você a se situar.<br>- <strong>Teste no projetor antes:</strong> o deck é HTML — abra o `index.html` em tela cheia no navegador (Chrome/Safari), funciona offline.<br>- Números marcados no roteiro (36%, 13.000, 99%, 19 microsserviços) são os &quot;momentos de manchete&quot; — fale-os devagar.</p>"}];
  const TOTAL = NOTES.length;
  const PUBLIC_FILE = "Apresentacao-Publico.html";
  const PUB_URL = encodeURI(PUBLIC_FILE);
  const TARGET = 50 * 60;

  const frameNow = document.getElementById('frameNow');
  const frameNext = document.getElementById('frameNext');
  const counter = document.getElementById('counter');
  const nextCap = document.getElementById('nextCap');
  const chipsEl = document.getElementById('chips');
  const skEl = document.getElementById('sk'), shEl = document.getElementById('sh'), stEl = document.getElementById('st');
  const roteiroEl = document.getElementById('roteiro');

  const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('prfmais-keynote') : null;
  let cur = Math.min(parseInt(location.hash.slice(1)) || 0, TOTAL - 1);

  frameNow.src = PUB_URL + '?role=preview#' + cur;
  frameNext.src = PUB_URL + '?role=preview#' + Math.min(cur + 1, TOTAL - 1);

  function setHash(frame, n){ try { frame.contentWindow.location.hash = '#' + n; } catch (_) { frame.src = PUB_URL + '?role=preview#' + n; } }

  function paint(){
    counter.textContent = (cur + 1) + ' / ' + TOTAL;
    setHash(frameNow, cur);
    setHash(frameNext, Math.min(cur + 1, TOTAL - 1));
    const d = NOTES[cur] || {}, sc = SCRIPT[cur] || {};
    skEl.textContent = d.k || '';
    shEl.textContent = d.h || ('Slide ' + (cur + 1));
    stEl.innerHTML = sc.time ? ('alvo <b>' + sc.time + '</b>') : '';
    roteiroEl.innerHTML = sc.html || '<p class="cue">Sem roteiro para este slide.</p>';
    roteiroEl.scrollTop = 0;
    chipsEl.innerHTML = (d.tp && d.tp.length) ? d.tp.map(x => '<span class="chip">' + x + '</span>').join('') : '';
    const nx = NOTES[cur + 1];
    nextCap.textContent = nx ? ((nx.k ? nx.k + ' · ' : '') + (nx.h || ('Slide ' + (cur + 2)))) : 'Fim da apresentação';
    if (String(location.hash.slice(1)) !== String(cur)) location.hash = cur;
  }
  function render(n){ cur = Math.max(0, Math.min(n, TOTAL - 1)); paint(); }
  function goto(n){ render(n); if (bc) bc.postMessage({ type:'goto', i: cur }); autoStart(); }
  if (bc) bc.onmessage = (e) => { if (e.data && e.data.type === 'goto' && e.data.i !== cur) render(e.data.i); };

  addEventListener('keydown', e => {
    const k = e.key;
    if (['ArrowRight','ArrowDown','PageDown',' '].includes(k)) { e.preventDefault(); goto(cur + 1); }
    else if (['ArrowLeft','ArrowUp','PageUp'].includes(k)) { e.preventDefault(); goto(cur - 1); }
    else if (k === 'Home') goto(0);
    else if (k === 'End') goto(TOTAL - 1);
    else if (k.toLowerCase() === 'r') resetTimer();
    else if (k.toLowerCase() === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
    else if (k === '+' || k === '=') setSize(rsize + 1);
    else if (k === '-' || k === '_') setSize(rsize - 1);
  });

  document.getElementById('btnPublic').addEventListener('click', () => {
    window.open(PUB_URL, 'prfmais_publico');
    setTimeout(() => { if (bc) bc.postMessage({ type:'goto', i: cur }); }, 700);
  });

  /* fonte do roteiro */
  let rsize = parseInt(localStorage.getItem('prfmais_rsize') || '21');
  function setSize(v){ rsize = Math.max(15, Math.min(34, v)); document.documentElement.style.setProperty('--rsize', rsize + 'px'); localStorage.setItem('prfmais_rsize', rsize); }
  document.getElementById('aPlus').addEventListener('click', () => setSize(rsize + 1));
  document.getElementById('aMinus').addEventListener('click', () => setSize(rsize - 1));
  setSize(rsize);

  /* timer */
  let elapsed = 0, running = false, tick = null;
  const elEl = document.getElementById('elapsed'), rmEl = document.getElementById('remainVal'), rmBox = document.getElementById('remain'), btnT = document.getElementById('btnTimer');
  function fmt(s){ s = Math.max(0, Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
  function paintTimer(){ elEl.textContent = fmt(elapsed); const r = TARGET - elapsed; rmEl.textContent = (r<0?'-':'') + fmt(Math.abs(r)); rmBox.classList.toggle('over', r < 0); rmBox.classList.toggle('ok', r >= 0 && r <= 300); }
  function startTimer(){ if (running) return; running = true; btnT.textContent = 'Pausar'; tick = setInterval(() => { elapsed++; paintTimer(); }, 1000); }
  function pauseTimer(){ running = false; btnT.textContent = 'Iniciar'; clearInterval(tick); }
  function resetTimer(){ pauseTimer(); elapsed = 0; paintTimer(); }
  function autoStart(){ if (!running && elapsed === 0) startTimer(); }
  btnT.addEventListener('click', () => running ? pauseTimer() : startTimer());
  document.getElementById('btnReset').addEventListener('click', resetTimer);

  const clockEl = document.getElementById('clock');
  function paintClock(){ const d = new Date(); clockEl.textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
  setInterval(paintClock, 1000); paintClock();

  frameNow.addEventListener('load', paint, { once:true });
  paint(); paintTimer();
</script>
